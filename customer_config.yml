# This playbook will push/ configure the fabric. The configs will be pulled from the location mentioned in 'src' variable.
# use ansible-playbook customer_config.yml -e "site_location=Carolina"  to push carolina configs or
#
#ansible-playbook customer_config.yml -e "site_location=NewYork" for NY configs
#
#**************************************************
#If BGP doesnt come up, a reboot might be required*
#**************************************************
#

---
- name: Push site specific configs
  hosts: all
  gather_facts: no
  vars:
    site_location: NewYork
#NewYork is default config. Use Carolina if required to push that site specific configs
  tasks:
    - name: "Push config for {{ site_location }}"
      junipernetworks.junos.junos_config:
        src: "/root/Juniper/Golden_configs/{{ site_location }}/{{ inventory_hostname }}.cfg"
        update: override
        comment: "Override for {{ site_location }} config by Ansible"
      register: config
    
    - name: verify if configs are pushed
      debug:
        msg: "override sucessful"
      when: config.changed
