            link-fault-management {
                apply-groups ETH-OAM-OPTIONS;
                interface ae1;
                interface ae2;
            }
        }
    }
    bgp {
        group V4-SPINE {
            type internal;
            local-address 100.118.191.134;
            import V4-SPN-BGP-IN;
            family inet {
                unicast;
            }
            family evpn {
                signaling;
            }
            export V4-SPN-BGP-OUT;
            multipath;
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor 100.118.191.129 {
                description "iBGP Session to DVTCDOSPN01";
            }
            neighbor 100.118.191.130 {
                description "iBGP Session to DVTCDOSPN02";
            }
        }
        group V6-SPINE {
            type internal;
            local-address 2001:578:116:1113:100:118:191:134;
            advertise-inactive;
            import V6-SPN-BGP-IN;
            family inet6 {
                unicast;
            }
            export V6-SPN-BGP-OUT;
            multipath;
            bfd-liveness-detection {
                minimum-interval 1000;
                multiplier 3;
            }
            neighbor 2001:578:116:1113:100:118:191:129 {
                description "iBGP Session to DVTCDOSPN01";
            }
            neighbor 2001:578:116:1113:100:118:191:130 {
                description "iBGP Session to DVTCDOSPN02";
            }
        }
        mtu-discovery;
        bgp-error-tolerance;
    }
    evpn {
        encapsulation vxlan;
        default-gateway no-gateway-community;
        multicast-mode ingress-replication;
        extended-vni-list all;
    }
    isis {
        interface ae1.0 {
            level 1 {
                metric 1600;
                hello-authentication-type md5;
            }
            point-to-point;
        }
        interface ae2.0 {
            level 1 {
                metric 1600;
                hello-authentication-type md5;
            }
            point-to-point;
        }
        interface lo0.0 {
            level 2 disable;
            passive;
        }
        level 1 wide-metrics-only;
        level 2 disable;
        topologies ipv6-unicast;
    }
    l2-learning {
        global-mac-table-aging-time 1800;
        global-mac-ip-table-aging-time 1200;
    }
    lldp {
        port-id-subtype interface-name;
        neighbour-port-info-display port-id;
        interface all;
    }
    lldp-med {
        interface all;
    }
    igmp-snooping {
        vlan default;
    }
    layer2-control {
        bpdu-block {
            interface ae3;
            interface ae7;
        }
    }
}
