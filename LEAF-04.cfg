firewall {
    family inet6 {
        filter V6-PROTECT_RE-IN {
            term DENY-NTP {
                from {
                    next-header udp;
                    destination-port ntp;
                }
                then {
                    count DENY-NTP-COUNT;
                    discard;
                }
            }
            term PERMIT-HOP-BY-HOP-OPTION {
                from {
                    next-header hop-by-hop;
                }
                then accept;
            }
            term PERMIT-BGP {
                from {
                    source-prefix-list {
                        BGP-PEERS;
                    }
                    next-header tcp;
                    destination-port bgp;
                }
                then accept;
            }
            term DENY-BGP {
