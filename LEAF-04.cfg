                    discard;
                }
            }
            term DENY-SNMP {
                from {
                    next-header udp;
                    destination-port snmp;
                }
                then {
                    count DENY-SNMP-COUNT;
                    discard;
                }
            }
            term DENY-ICMPV6-PKT-TOO-BIG {
                from {
                    next-header icmpv6;
                    icmp-type packet-too-big;
                }
                then {
                    count DENY-ICMPV6-PKT-TOO-BIG-COUNT;
                    discard;
                }
            }
            term PERMIT-ICMPv6 {
                from {
                    next-header icmpv6;
                }
                then {
                    policer ICMP-POLICER;
                    accept;
                }
            }
            term PERMIT-TRACEROUTE {
                from {
                    next-header udp;
                    destination-port 33434-33523;
                }
                then {
                    policer SMALL-BW-POLICER;
                    accept;
                }
            }
            term PERMIT-BFD {
                from {
                    source-prefix-list {
                        BGP-PEERS;
                    }
                    next-header udp;
                    destination-port [ 3784 4784 ];
                }
                then accept;
            }
            term DENY-EVERYTHING-ELSE {
                then {
                    count DENY-EVERYTHING-ELSE-COUNT;
                    discard;
                }
            }
        }
    }
    policer ICMP-POLICER {
        if-exceeding {
            bandwidth-limit 16m;
            burst-size-limit 1600000;
        }
        then discard;
    }
    policer SMALL-BW-POLICER {
