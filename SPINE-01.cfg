                    next-header tcp;
                    destination-port ssh;
                }
                then {
                    count DENY-SSH-COUNT;
                    discard;
                }
            }
            term DENY-SNMP {
                from {
                    next-header udp;
                    destination-port snmp;
                }
                then {
                    count DENY-SNMP-COUNT;
                    discard;
                }
            }
            term DENY-ICMPV6-PKT-TOO-BIG {
