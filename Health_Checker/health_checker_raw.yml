#In this Playbook, we are going to capture data for a specific MAC+IP for Rocket and Simba- the clients.
#
#
#ROCKET IRB.1364 - 10.8.221.4/24 and IRB MAC -  00:31:46:47:62:a1
#
#SIMBA IRB.1363- 10.8.220.5/24 and IRB MAC- 00:31:46:47:63:c1
#
#This is symmetric IRB setup with V555 as transit VNI
#
#

---
- name: EVPN health checker
  hosts: sample
  gather_facts: no

  tasks:
    - name: Commands for LEAFs
      junipernetworks.junos.junos_command:
        commands: "{{ lookup('template', 'commands.j2').split('\n') | select('search', '\\S') | list }}"
      register: health_output

    - name: Print the RAW outputs on screen
      debug:
        msg: "{{ health_output}}"

    - name: Pritn stdout
      debug:
        msg: "{{ health_output.stdout }}"

    - name: STDOUT[0]
      debug:
        msg: "{{ health_output.stdout[0] }}"

    - name: STDOUTLINES
      debug:
        msg: "{{ health_output.stdout_lines }}"
