---
- name: Save configs on local machine
  hosts: all
  gather_facts: no
  connection: netconf

  tasks:
    - name: 1. Force save via CLI-in-Shell
      junipernetworks.junos.junos_command:
        commands:
          # This tells the QFX: "Go to the shell, open a CLI session, and run this specific string"
          - "start shell command \"cli -c 'show configuration | save /var/tmp/{{ inventory_hostname }}_.cfg'\""
      register: save_result

    - name: 2. Wait for write (5 seconds)
      pause:
        seconds: 5

    - name: 3. Final Verification
      junipernetworks.junos.junos_command:
        commands:
          - "file list /var/tmp/{{ inventory_hostname }}_.cfg"
      register: verify

    - name: 4. Display STDOUT of verification
      debug:
        msg:
          - "Device: {{ inventory_hostname }}"
          - "Result: {{ verify.stdout_lines[0][0] }}"
